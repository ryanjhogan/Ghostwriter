<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="index.html">
            <img src="logo.png" width="50" height="50" alt="">
            Ghostwriter

        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNavDropdown"
            aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavDropdown">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>
                <li class="nav-item active">
                    <a class="nav-link" href="makebook.html">Create Book<span class="sr-only">(current)</span></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="bookhistory.html">Book History</a>
                </li>
            </ul>
        </div>
    </nav>
    <div class="container">
        <div class="row justify-content-center build-body border rounded mb-3 ml-1 mr-1">
            <div class="col-md-8 text-center">
                <h1 class="text-center build-text">What topic do you want to write about?</h1>
                <input type="text" id="idea" placeholder="Put your idea here..." class="form-control">
                <!--"test" for dev, "send" for prod-->
                <button id="send" class="btn btn-primary pl-3 pr-3 mt-3">Send to AI</button>
            </div>
        </div>
        <div id="loading" class="d-flex justify-content-center hidec">
            <div class="spinner-border spinner-grow" role="status"></div>
            <h3 class="mr-3 ml-3">Waiting on AI response</h3>
            <div class="spinner-border spinner-grow" role="status">
            </div>
        </div>
        <div class="row justify-content-center">
            <!--Pull book text from here-->
            <div id="response" class="col-12 col-lg-8 build-body border mt-3 rounded d-none">
                <div contenteditable="true"><p id = "entry"></p></div>
            </div>
            <div class="col-12 col-lg-4 img-choice d-flex flex-column align-items-center">
                <div id="covers" class="justify-content-center img-submit p-3 mt-3 border rounded d-none">
                    <img id="cover" src="" class="img-fluid mb-3">
                    <div class="custom-file file-select">
                        <!--Pull image fil from here-->
                        <input type="file" class="custom-file-input" id="coverPhoto" accept=".png, .jpeg">
                        <label class="custom-file-label" for="coverPhoto">Choose file...</label>
                        <div class="invalid-feedback">Example invalid custom file feedback</div>
                      </div>
                </div>
                <div id="author-div" class="d-flex justify-content-center bg-white border rounded p-3 mt-3 author hidec">
                    <label for="author" class="col-form-label pr-3">Author:</label>
                    <!--Pull author name from here-->
                    <input id="author" class="form-control" type="text" placeholder="Enter name...">
                </div>
                <div class="d-flex justify-content-center">
                    <!--Call save function when this button is pressed-->
                    <button id="save" class="btn btn-primary btn-lg mt-3 mb-3 d-none">Save this eBook</button>
                </div>
            </div>
        </div>
    </div>
    <form id="downloadForm" action="/final.php/buildBook" method="POST" enctype="multipart/form-data" style="display:none;">
    <input type="hidden" name="title" id="formTitle">
    <input type="hidden" name="chapters" id="formChapters">
    <input type="hidden" name="author" id="formAuthor">
    <input type="hidden" name="body" id="formBody">
    <input type="hidden" name="promptid" id="promptId">
    <input type="file" accept="image/png, image/jpeg" name="coverPhoto" id="formCoverPhoto">
    </form>
    <script src="imageselect.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"

        crossorigin="anonymous"></script>

        crossorigin="anonymous"></script>
